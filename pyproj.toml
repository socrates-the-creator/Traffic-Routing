[build-system]
requires = ["setuptools>=65.5.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-flask-app"
requires-python = ">=3.9,<3.10"
dependencies = [
  "flask==2.2.5",
  "gunicorn==21.2.0",
  "python-dotenv==1.0.0",
  "numpy==1.24.3",
  "pandas==2.0.3",
  "scikit-learn==1.3.0",
  "geopandas==0.13.2",
  "shapely==2.0.1",
  "networkx==3.1",
  "osmnx==1.6.0",
  "fiona==1.9.4",
  "pyproj==3.6.0",
  "rtree==1.0.1",
  "tensorflow==2.14.0",
  "protobuf==3.20.3",
  "matplotlib==3.7.2",
  "seaborn==0.12.2",
  "folium==0.14.0",
  "plotly==5.15.0",
  "dash==2.11.1",
  "dash-bootstrap-components==1.4.1",
  "requests==2.31.0",
  "overpy==0.6",
  "schedule==1.2.0",
  "typing-extensions==4.12.2"
]
